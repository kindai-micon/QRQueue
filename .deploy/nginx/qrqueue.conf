# QRQueue 用 nginx リバースプロキシ設定
# 配置: /etc/nginx/sites-available/qrqueue.conf に置き、
#       /etc/nginx/sites-enabled/ へシンボリックリンクして `nginx -t && systemctl reload nginx`
#
# 経路: Cloudflare Tunnel(cloudflared) → nginx(本ファイル, :80) → qrqueue.service(127.0.0.1:5000)

# WebSocket アップグレード用の変数(sites-enabled は http{} 内に include されるためここに置ける)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # SignalR の WebSocket アップグレードを中継
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # アプリの ForwardedHeaders / QR の BaseURL 生成に必要なヘッダ
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR の長時間接続・SSE を途切れさせない
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
